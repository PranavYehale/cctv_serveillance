<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Camera AI Surveillance System</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              surveillance: {
                dark: '#0d1117',
                panel: '#161b22',
                border: '#30363d',
                accent: '#238636',
                danger: '#da3633',
                warning: '#d29922',
                cyan: '#38bdf8'
              }
            },
            fontFamily: {
              mono: ['JetBrains Mono', 'monospace']
            }
          }
        }
      }
    </script>
    
    <!-- TensorFlow.js & COCO-SSD Model CDN Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

    <!-- MP4 Muxer CDN for 100% Genuine H.264 MP4 Output -->
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.4/build/mp4-muxer.min.js"></script>
  </head>
  <body class="bg-[#0d1117] text-[#f0f6fc] min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
